import = ["~/.config/alacritty/local.toml"]

[shell]
args = ["-c", "tmux new-session -A -D -s main"]

[env]
term = "xterm-256color"

[window]
padding = { x = 3, y = 3 }
dynamic_padding = true
opacity = 0.90
blur = true
decorations = "None"
startup_mode = 'Maximized'
option_as_alt = 'OnlyLeft'

# font is resolved dynamically to local.toml via post_install

[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'

[colors.normal]
black = '#151e1e'
red = '#d7546e'
green = '#7ebe5a'
yellow = '#c0af68'
blue = '#3a82da'
magenta = '#ad7af9'
cyan = '#5bdded'
white = '#a9b1d6'

[colors.bright]
black = '#404858'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#c0caf5'

[[colors.indexed_colors]]
index = 16
color = '#00284f'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'

[cursor]
style = { shape = "Beam", blinking = "Always" }
thickness = 0.3

[keyboard]
bindings = [
  { key = "C", mods = "Option", action = "WordLeft" },
  { key = "D", mods = "Option", action = "WordRight" },
]
